<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:#000;
}

.slider-container{
    width:100%;
    max-width:1920px;
    aspect-ratio:16/9;
    overflow:hidden;
    position:relative;
    margin:auto;
    border-radius:20px;
}

.slider-track{
    display:flex;
    width:max-content;
    animation: scroll 60s linear infinite;
}

.slider-track img{
    width:1920px;
    height:1080px;
    object-fit:cover;
    flex-shrink:0;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<div class="slider-container">
    <div class="slider-track">

        <!-- الصور الأصلية -->
        <img src="11th-gate-2eWa4jDCD84.jpg">
        <img src="Soul_20251129_224514_0000.png">
        <img src="af8025f1c50fe07a1ab856bda31c8759.jpg">
        <img src="file_000000002d0871f4975471671dc87bfb.png">

        <!-- تكرار الصور لمنع أي انقطاع -->
        <img src="image1.jpg">
        <img src="image2.jpg">
        <img src="image3.jpg">
        <img src="image4.jpg">

    </div>
</div>

</body>
</html>
