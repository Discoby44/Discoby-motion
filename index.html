<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    background:#000;
}

.slider{
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    position:relative;
}

.track{
    display:flex;
    width:max-content;
    animation: scroll 60s linear infinite;
}

.track img{
    width:1920px;
    height:1080px;
    object-fit:cover;
    flex-shrink:0;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}
</style>
</head>

<body>

<div class="slider">
    <div class="track">

        <img src="11th-gate-2eWa4jDCD84.jpg">
        <img src="image2.jpg">
        <img src="image3.jpg">
        <img src="image4.jpg">

        <!-- تكرار الصور لمنع الانقطاع -->
        <img src="image1.jpg">
        <img src="image2.jpg">
        <img src="image3.jpg">
        <img src="image4.jpg">

    </div>
</div>

</body>
</html>
