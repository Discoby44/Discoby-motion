<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tangier In Motion</title>

<style>

body{
margin:0;
background:#111;
overflow:hidden;
}

.slider{
display:flex;
width:max-content;
animation:move 25s linear infinite;
}

.slider img{
width:350px;
height:220px;
object-fit:cover;
margin-right:15px;
border-radius:15px;
}

@keyframes move{
from{
transform:translateX(100%);
}
to{
transform:translateX(-100%);
}
}

</style>
</head>

<body>

<div class="slider">

<img src="kyriacos-georgiou-CMmgfHQiYsc.jpg">
<img src="milad-alizadeh-RuzMCeXVsXA.jpg">
<img src="niklas-VqouWpsuziE.jpg">
<img src="othman-alghanmi-PoJ6j3i6DLA.jpg">
<img src="sergio-kian-jVqbmK14m-M.jpg">
  <video autoplay muted loop playsinline width="100%">
    <source src="VN20260530_192807.mp4" type="video/mp4">
</video>
  
</div>

</body>
</html>
