<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tangier In Motion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    overflow:hidden;
}

.slider-container{
    width:100%;
    height:450px;
    overflow:hidden;
    position:relative;
}

.slider-track{
    display:flex;
    width:max-content;
    animation:scroll 60s linear infinite;
}

.slider-track img{
    width:800px;
    height:450px;
    object-fit:cover;
    flex-shrink:0;
    margin-right:15px;
    border-radius:18px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(calc(-50%));
    }
}

</style>
</head>

<body>

<div class="slider-container">

<div class="slider-track">

    <!-- الصور الأصلية -->

    <img src="12615-1.jpg">
    <img src="59ydxutpgv191.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">

    <!-- نفس الصور مرة ثانية لمنع الانقطاع -->

    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">

</div>

</div>

</body>
</html>
